name: Open weekly sessions

on:
  schedule:
    - cron: '0 9 * * 2'  # Tuesday 09:00 UTC = 12:00 Israel time
  workflow_dispatch:       # allow manual trigger

jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - name: Call open-sessions cron endpoint
        run: |
          curl -f -X GET "${{ secrets.APP_URL }}/api/cron/open-sessions" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
