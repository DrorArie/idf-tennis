name: Close weekly sessions

on:
  schedule:
    - cron: '0 9 * * 4'  # Thursday 09:00 UTC = 12:00 Israel time
  workflow_dispatch:       # allow manual trigger

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Call close-sessions cron endpoint
        run: |
          curl -f -X GET "${{ secrets.APP_URL }}/api/cron/close-sessions" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
